<h1>{{ tytul_listy }}</h1>

<ul>
  @for (s of studenci; track s) {
    <li>
      <span class="klikalne" (click)="przelaczSzczegoly(s)">
        {{ s.imie }} {{ s.nazwisko }}
      </span>
      <button (click)="edytowany = s">Edytuj</button>

      @if (rozwiniety === s) {
        <div class="szczegoly">
          Wiek: {{ s.wiek }}<br />
          Oceny:
          @for (o of s.oceny; track $index) {
            <span class="ocena" [class.negatywna]="o === 2">{{ o.toFixed(1) }}</span>
          } @empty {
            brak ocen
          }
        </div>
      }
    </li>
  }
</ul>

<button (click)="pokazDodawanie = !pokazDodawanie">Dodaj studenta</button>

@if (pokazDodawanie) {
  <app-add-student (dodaj)="dodajStudenta($event)" />
}

@if (edytowany) {
  <app-edit-student [student]="edytowany" (zamknij)="edytowany = null" />
}
